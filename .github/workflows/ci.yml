name: CI

# Pull requests get a fast check: lint, one test job, the eval gate.
# Pushes to main (merged PRs) and manual runs get the full OS x Python matrix.
# Docs-only changes skip CI (docs.yml builds the site).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "*.md"
      - ".github/workflows/docs.yml"
      - ".github/workflows/eval-gliner.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/zizmor.yml"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "*.md"
      - ".github/workflows/docs.yml"
      - ".github/workflows/eval-gliner.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/zizmor.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .

  test:
    # PR: the oldest supported Python on Linux (the eval job runs 3.12).
    if: github.event_name == 'pull_request'
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Test
        # Unit tests stub out Presidio/spaCy, so no model download is needed.
        # The proxy tests exercise the real ASGI stack with a mocked upstream.
        run: pytest -q

  test-matrix:
    # main and manual runs: full Python range on Linux, two versions on macOS and Windows.
    if: github.event_name != 'pull_request'
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Test
        # Unit tests stub out Presidio/spaCy, so no model download is needed.
        # The proxy tests exercise the real ASGI stack with a mocked upstream.
        run: pytest -q

  eval:
    # Detection quality: per-entity recall/precision on the labeled corpus and the
    # code-like inputs (tests/eval), with the real small spaCy models. Fails below
    # thresholds.json. Runs on PRs only: a merged PR already passed it.
    name: eval gate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with dev extras and models)
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
          python -m spacy download fr_core_news_sm
          python -m spacy download de_core_news_sm
          python -m spacy download it_core_news_sm
      - name: Eval gate
        run: python -m tests.eval.run_eval --gate -v
