name: Eval (GLiNER)

# The GLiNER backend needs PyTorch and a ~1.1 GB model, too heavy for every push.
# Weekly, and on demand, it runs the same labeled corpus against
# tests/eval/thresholds-gliner.json.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gliner:
    name: eval gate (GLiNER)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-gliner-${{ hashFiles('pii_scrub/config.py') }}
      - name: Install (CPU torch, gliner extra)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,gliner]"
          python -m spacy download en_core_web_sm
      - name: Eval gate (GLiNER)
        run: python -m tests.eval.run_eval --backend gliner --gate -v
